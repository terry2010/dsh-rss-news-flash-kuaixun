<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快讯</title>
<style>
  :root { color-scheme: light dark; --fz: 1; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: Canvas; color: CanvasText;
  }
  .bar {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
    border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); font-size: 12px;
    flex-wrap: wrap;
  }
  .bar .meta { opacity: .65; }
  .bar button, .bar select {
    height: 26px; padding: 0 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  .bar input[type="number"] {
    width: 46px; height: 26px; padding: 0 4px; text-align: center; font: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 6px;
    background: transparent; color: inherit;
  }
  .bar input[type="search"] {
    width: 120px; height: 26px; padding: 0 8px; font: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 6px;
    background: transparent; color: inherit;
  }
  .bar input[type="date"] {
    height: 26px; padding: 0 4px; font: inherit; color-scheme: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 6px;
    background: transparent; color: inherit;
  }
  /* 段选：全部 | 重要 */
  .seg { display: inline-flex; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; height: 26px; padding: 0 10px; }
  .seg button.on { background: #2f6feb; color: #fff; }
  /* toggle 开关 */
  .tgl { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; opacity: .9; }
  .tgl input { display: none; }
  .tgl .trk {
    width: 30px; height: 17px; border-radius: 9px; position: relative; transition: background .15s;
    background: color-mix(in srgb, CanvasText 30%, transparent);
  }
  .tgl .trk::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: Canvas; transition: left .15s;
    box-shadow: 0 1px 2px color-mix(in srgb, CanvasText 40%, transparent);
  }
  .tgl input:checked + .trk { background: #2f6feb; }
  .tgl input:checked + .trk::after { left: 15px; }
  .fz { display: inline-flex; gap: 2px; }
  .fz button { width: 28px; padding: 0; }
  #list { font-size: calc(13px * var(--fz)); }
  .row {
    display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 2px 10px;
    padding: 5px 12px; align-items: baseline; position: relative;
    border-bottom: 1px solid color-mix(in srgb, CanvasText 8%, transparent);
  }
  .row.fresh { animation: flash 2.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, #ff9500 22%, transparent); } to { background: transparent; } }
  .t { grid-column: 1; grid-row: 1 / span 2; font-variant-numeric: tabular-nums; opacity: .55; font-size: .85em; padding-top: 2px; }
  .src {
    grid-column: 2; grid-row: 1; font-size: .75em; opacity: .7; padding: 1px 5px; border-radius: 4px; align-self: center;
    background: color-mix(in srgb, CanvasText 10%, transparent); white-space: nowrap;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis;
  }
  .src.multi { background: color-mix(in srgb, #2f6feb 16%, transparent); color: #2f6feb; font-weight: 600; opacity: 1; cursor: pointer; }
  .src.multi:hover { background: color-mix(in srgb, #2f6feb 28%, transparent); }
  .src.multi .tot { display: inline-block; font-weight: 700; padding: 0 4px; margin-right: 4px; border-radius: 3px; background: #2f6feb; color: #fff; }
  /* 展开态第 1 行的本源徽标：与 .tot 同色系的浅色 chip */
  .src.multi .own { display: inline-block; font-weight: 600; padding: 0 4px; margin-right: 4px; border-radius: 3px; background: color-mix(in srgb, Canvas 22%, transparent); }
  /* 市场域/栏目标签 chips：左列第二行，位于来源徽标正下方 */
  .tags { grid-column: 2; grid-row: 2; display: inline-flex; gap: 3px; align-items: center; justify-self: start; min-width: 0; max-width: 240px; overflow: hidden; }
  .tags .mkt { flex: none; font-size: .72em; font-weight: 600; padding: 0 4px; border-radius: 3px; white-space: nowrap; background: color-mix(in srgb, #d45500 13%, transparent); color: #d45500; }
  .tags .ctag { font-size: .72em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: color-mix(in srgb, CanvasText 52%, transparent); }
  .row.sub .tags .mkt, .row.sub .tags .ctag { font-size: .66em; }
  /* 聚合簇展开后的各源子行 */
  .row.sub { padding-left: 58px; background: color-mix(in srgb, CanvasText 3%, transparent); }
  .row.sub .t, .row.sub .src { font-size: .8em; }
  .txt { grid-column: 3; grid-row: 1 / span 2; min-width: 0; align-self: start; padding-top: 1px; }
  .txt a { color: inherit; text-decoration: none; }
  .txt a:hover { text-decoration: underline; }
  .imp { color: #d45500; font-weight: 600; }
  .more { margin-left: 6px; font-size: .85em; color: #2f6feb; cursor: pointer; white-space: nowrap; }
  .more:hover { text-decoration: underline; }
  /* 行内「▸正文」展开的正文块：paddingLeft 由 JS 对齐到标题列 */
  .body {
    padding: 2px 12px 8px 0; color: color-mix(in srgb, CanvasText 68%, transparent);
    font-size: .85em; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow-y: auto;
  }
  .empty, .err { padding: 30px; text-align: center; opacity: .6; }
  /* ---- 弹层（设置/提醒共用 .ovl） ---- */
  .ovl {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: color-mix(in srgb, CanvasText 30%, transparent);
  }
  .ovl.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; }
  .ovl .panel {
    width: min(420px, 92vw); max-height: 76vh; overflow: auto; padding: 16px 18px;
    background: Canvas; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
    border-radius: 10px; box-shadow: 0 8px 30px color-mix(in srgb, CanvasText 35%, transparent);
    font-size: 13px;
  }
  .ovl h3 { margin: 0 0 10px; font-size: 14px; }
  .ovl h4 { margin: 14px 0 6px; font-size: 12px; opacity: .7; font-weight: 600; }
  .ovl .row2 { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .ovl .row2 .nm { flex: 1; }
  .ovl .row2 input[type="text"] {
    width: 90px; height: 24px; padding: 0 6px; font: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 5px;
    background: transparent; color: inherit;
  }
  .ovl input.kw {
    width: 100%; height: 30px; padding: 0 8px; font: inherit; margin: 4px 0 2px;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 6px;
    background: transparent; color: inherit;
  }
  /* 关键字 tag 编辑区 */
  .ovl .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; min-height: 26px; }
  .ovl .tag {
    display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 3px 0 9px;
    border-radius: 12px; font-size: 12px; cursor: pointer; user-select: none;
    background: color-mix(in srgb, #2f6feb 13%, transparent);
    border: 1px solid color-mix(in srgb, #2f6feb 35%, transparent);
  }
  .ovl .tag:hover { background: color-mix(in srgb, #2f6feb 22%, transparent); }
  .ovl .tag .x {
    border: 0; background: none; cursor: pointer; padding: 0 4px; font-size: 13px;
    line-height: 1; color: inherit; opacity: .55; border-radius: 50%;
  }
  .ovl .tag .x:hover { opacity: 1; background: color-mix(in srgb, CanvasText 15%, transparent); }
  .ovl select {
    height: 26px; font: inherit; background: transparent; color: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 5px;
  }
  .ovl .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .ovl .foot button {
    height: 28px; padding: 0 14px; border-radius: 6px; font: inherit; cursor: pointer;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit;
  }
  .ovl .foot .pri { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  .ovl .hint { font-size: 12px; opacity: .6; line-height: 1.6; }
</style>
</head>
<body>
<div class="bar">
  <b>快讯</b>
  <select id="srcSel" title="只看某个快讯源"><option value="">全部源</option></select>
  <select id="mktSel" title="按市场域筛选">
    <option value="">全部市场</option>
    <option value="A股">A股</option><option value="港股">港股</option><option value="美股">美股</option>
    <option value="商品">商品</option><option value="外汇">外汇</option><option value="加密">加密</option>
    <option value="国际">国际</option><option value="其他">其他</option>
  </select>
  <input id="kw" type="search" placeholder="搜索快讯…" title="搜索标题/摘要（库内全量，Esc 清空）" autocomplete="off">
  <select id="range" title="搜索时间范围（仅搜索时生效）">
    <option value="today">今天</option><option value="yesterday">昨天</option>
    <option value="7d">近7天</option><option value="30d">近30天</option>
    <option value="all">全部</option><option value="custom">自定义</option>
  </select>
  <input type="date" id="from" hidden><input type="date" id="to" hidden>
  <span class="seg" id="modeSeg">
    <button data-mode="all" class="on">全部</button><button data-mode="imp">重要</button><button data-mode="multi">多源</button>
  </span>
  <input type="number" id="ivMin" min="1" max="60" step="1" title="刷新间隔（分钟，最小 1）" value="1"><span style="opacity:.55">分钟</span>
  <label class="tgl" title="按左侧间隔自动刷新并滚到最新"><input type="checkbox" id="autoTgl" checked><span class="trk"></span>自动刷新</label>
  <span class="fz">
    <button id="fzDn" title="缩小字号">A−</button><button id="fzUp" title="放大字号">A＋</button>
  </span>
  <span class="meta" id="meta">载入…</span>
  <span style="flex:1"></span>
  <button id="btnCfg" title="快讯显示与推送提醒设置">设置</button>
  <button id="btnNow">刷新</button>
</div>
<div id="list"></div>

<div id="cfg" class="ovl">
  <div class="panel">
    <h3>快讯设置</h3>
    <h4>显示源（勾选=显示，短标可改）</h4>
    <div id="cfgSrcs"></div>
    <h4>重要</h4>
    <div class="row2"><span class="nm">「重要」口径 = 源原生标记（财联社红电/金十加红/同花顺标红）；东财/见闻/新浪无原生标记不进重要视图</span></div>
    <div class="row2"><label><input type="checkbox" id="cfgMark"> 重要条目加橙标</label></div>
    <h4>推送提醒（桌面通知，与时段快报同通道）</h4>
    <div class="row2"><label><input type="checkbox" id="alImp"> <b>重要快讯</b></label><span class="hint" style="flex:1">源标记的重要条目抓到即推</span></div>
    <div class="row2"><label><input type="checkbox" id="alMulti"> <b>多源快讯</b></label><span class="hint" style="flex:1">同一事件被多个源报道时推</span></div>
    <div class="row2"><label><input type="checkbox" id="alKwOn"> <b>关键字快讯</b></label><span class="hint" style="flex:1">标题/正文命中关键字时推</span></div>
    <div id="alKwBox" hidden>
      <div class="tags" id="alertTags"></div>
      <input id="alertKw" class="kw" type="text" placeholder="输入关键字后回车" autocomplete="off">
      <div class="hint">回车上屏；点击 tag 修改、× 删除；最多 20 个。关闭开关不删词。</div>
    </div>
    <div class="foot"><button id="cfgReset">恢复默认</button><button id="cfgOk" class="pri">完成</button></div>
  </div>
</div>

<script>
'use strict'
const $ = (s) => document.querySelector(s)
const API = '/dsh-rss-news-flash-kuaixun/api' // 独立库：条目/提醒都走本插件端点，不再读主插件 /api/items
const SOURCES = [
  { id: 'https://www.cls.cn/telegraph', name: '财联社电报', short: '财联社' },
  { id: 'https://www.jin10.com/', name: '金十数据', short: '金十' },
  { id: 'https://wallstreetcn.com/live', name: '华尔街见闻', short: '见闻' },
  { id: 'https://kuaixun.eastmoney.com/', name: '东方财富', short: '东财' },
  { id: 'https://news.10jqka.com.cn/', name: '同花顺', short: '同花顺' },
  { id: 'https://finance.sina.com.cn/7x24/', name: '新浪财经', short: '新浪' }, // 尾斜杠必须与 sources.flash.json 一致——source= 是精确匹配
]

// ---- 视图层配置（localStorage：伴随页自己的持久层，不动主插件 prefs） ----
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(`kx.${k}`)); return v ?? d } catch { return d } },
  set(k, v) { localStorage.setItem(`kx.${k}`, JSON.stringify(v)) },
}
const cfg = {
  get fz() { return store.get('fz', 1) },
  get src() { // 旧值可能缺尾斜杠（新浪源 id 修过）——归一到 SOURCES 里的规范 id
    const v = String(store.get('src', ''))
    return SOURCES.find((s) => s.id === v || s.id.replace(/\/$/, '') === v.replace(/\/$/, ''))?.id ?? ''
  },            // '' = 全部源
  get market() { return String(store.get('market', '')) }, // '' = 全部市场
  get modes() { // 多选过滤集：[] = 全部；旧版单选字符串自动迁移
    const v = store.get('mode', 'all')
    if (Array.isArray(v)) return v.filter((m) => m === 'imp' || m === 'multi')
    return v === 'imp' || v === 'multi' ? [v] : []
  },
  get auto() { return store.get('auto', true) },        // 自动刷新开关
  get hide() { return store.get('hide', {}) },           // {sourceId: true} = 隐藏
  get alias() { return store.get('alias', {}) },         // {sourceId: '短标'}
  get ivMin() { return Math.max(1, store.get('ivMin', 1)) }, // 刷新间隔（分钟，≥1）
  get mark() { return store.get('mark', true) },          // 重要条目橙标
}
const FZ = { MIN: 0.8, MAX: 1.6, STEP: 0.1 }

let known = new Set(), firstLoad = true, timer = 0, lastItems = [], kw = '', kwTimer = 0
const expanded = new Set()   // 聚合簇展开态：key=rep.id
const openBodies = new Set() // 正文展开态：key=item.id——刷新重建 DOM 后保持展开
let range = store.get('range', 'today'), customFrom = store.get('cf', ''), customTo = store.get('ct', '')

// 主题：?theme= 首帧 + rnd-theme postMessage 跟随主阅读器
const q = new URLSearchParams(location.search)
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme')
window.addEventListener('message', (e) => {
  if (e.data?.type === 'rnd-theme' && e.data.theme) document.documentElement.dataset.theme = e.data.theme
})

const hm = (iso) => {
  const d = new Date(iso)
  const p = (n) => String(n).padStart(2, '0')
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}` // 统一 M/D HH:mm——跨零点不混排
}
const txt = (it) => (it.title || '').trim() || (it.content || '').replace(/<[^>]+>/g, '').trim()
const decodeEnt = (s) => s.replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'").replace(/&amp;/g, '&')
// 链接协议白名单——源 API 的 link 字段是不可信数据，javascript:/data: 等一律回退 '#' 防 XSS
const safeHref = (u) => (/^https?:\/\//i.test(u || '') ? u : '#')
const shortOf = (id) => cfg.alias[id] || SOURCES.find((s) => s.id === id)?.short || '快讯'
const isImp = (it) => it.state?.hot === true // 源原生重要标记（红电/加红/color=2）

async function api(path) {
  const r = await fetch(`${API}${path}`, { credentials: 'same-origin' })
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  return r.json()
}

const uniqById = (items) => {
  const m = new Map()
  for (const it of items) m.set(it.id, it)
  return [...m.values()]
}
// 展示排序按事件时间 publishedAt（缺失回退 fetchedAt）——回补进库的历史条目沉到真实时间位，而不是按入库时间顶到最上面
const byTimeDesc = (a, b) => String(b.publishedAt || b.fetchedAt || '').localeCompare(String(a.publishedAt || a.fetchedAt || ''))

// ---- 跨源聚类：标题归一化后 bigram Dice 相似度，并查集合并同一事件 ----
// 六源同一新闻经常重复上榜——聚成一行，源徽标显示「首发源×N」。
const normTitle = (t) => (t || '').toLowerCase()
  .replace(/【[^】]*】|\[[^\]]*\]|（[^）]*）|\([^)]*\)/g, ' ')   // 【财联社】/[快讯] 类前后缀
  .replace(/[\s"'“”‘’《》「」『』:：;；,，.。!！?？、·\-—_~|/\\+*=&%$#@^<>]+/g, '')
const bigrams = (s) => { const m = new Set(); for (let i = 0; i + 1 < s.length; i++) m.add(s.slice(i, i + 2)); return m }
const dice = (a, b) => { if (!a.size || !b.size) return 0; let n = 0; for (const x of a) if (b.has(x)) n++; return 2 * n / (a.size + b.size) }
// 长标题 0.55 即并；归一化后 <8 字的短标题收紧到 0.72，防「收评/快讯」类泛词误并
const SIM_LOOSE = 0.55, SIM_SHORT = 0.72, SHORT_LEN = 8

function clusterize(items) {
  const n = items.length
  if (!n) return []
  const norms = items.map((it) => normTitle(txt(it)))
  const grams = norms.map(bigrams)
  const parent = items.map((_, i) => i)
  const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])))
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = grams[i], b = grams[j]
      if (!a.size || !b.size) continue
      const th = Math.min(norms[i].length, norms[j].length) < SHORT_LEN ? SIM_SHORT : SIM_LOOSE
      if (dice(a, b) >= th) parent[find(i)] = find(j)
    }
  }
  const groups = new Map()
  items.forEach((it, i) => {
    const r = find(i)
    if (!groups.has(r)) groups.set(r, [])
    groups.get(r).push(it)
  })
  const clusters = [...groups.values()].map((members) => {
    members.sort((a, b) => Number(isImp(b)) - Number(isImp(a))
      || txt(b).length - txt(a).length || byTimeDesc(a, b))
    const srcs = [...new Set(members.map((m) => m.sourceId))]
    return { items: members, rep: members[0], srcs, hot: members.some(isImp) }
  })
  clusters.sort((a, b) => byTimeDesc(a.rep, b.rep))
  return clusters
}

const DAY = 86400e3
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate())
const iso = (d) => d.toISOString()
// 搜索时间范围 → after/before（ISO，含端点）；仅 kw 非空时由 load() 使用
function rangeBounds() {
  const today = dayStart(new Date()), endToday = new Date(today.getTime() + DAY - 1)
  const last = (n) => ({ after: iso(new Date(today.getTime() - (n - 1) * DAY)), before: iso(endToday) })
  if (range === 'yesterday') return { after: iso(new Date(today.getTime() - DAY)), before: iso(new Date(today.getTime() - 1)) }
  if (range === '7d') return last(7)
  if (range === '30d') return last(30)
  if (range === 'all') return {}
  if (range === 'custom') {
    const out = {}
    if (customFrom) out.after = iso(new Date(`${customFrom}T00:00:00`))
    if (customTo) out.before = iso(new Date(`${customTo}T23:59:59.999`))
    return out
  }
  return { after: iso(today), before: iso(endToday) } // today 默认
}

async function load() {
  const rb = kw ? rangeBounds() : {}
  const k = kw ? `&q=${encodeURIComponent(kw)}${rb.after ? `&after=${encodeURIComponent(rb.after)}` : ''}${rb.before ? `&before=${encodeURIComponent(rb.before)}` : ''}` : '' // 后端 LIKE+时间范围，本库全量
  const page = (source, p) => api(`/items?source=${encodeURIComponent(source)}${k}&sort=published&page=${p}&pageSize=50`).catch(() => ({ items: [] }))
  // 按源拉取：全局 sort=fetched 前 N 条会被财联社刷屏挤掉其它源（实测最近100条里财联社92条、金十仅2条）
  if (cfg.src) {
    const pages = await Promise.all([1, 2].map((p) => page(cfg.src, p)))
    return clusterize(uniqById(pages.flatMap((x) => x.items || [])).sort(byTimeDesc).slice(0, 150))
  }
  const pages = await Promise.all(SOURCES.map((s) => page(s.id, 1)))
  return clusterize(uniqById(pages.flatMap((x) => x.items || [])).sort(byTimeDesc))
}

// 标签 chips：市场域 chip（与原生 tag 同名时去重）+ 首个源原生栏目名（悬停看全量）
const tagChips = (m) => {
  const mk = m.market
  const show = (Array.isArray(m.tags) ? m.tags : []).filter((x) => x && x !== mk)
  if ((!mk || mk === '其他') && !show.length) return null
  const el = document.createElement('span'); el.className = 'tags'
  if (mk && mk !== '其他') {
    const me = document.createElement('span'); me.className = 'mkt'; me.textContent = mk; el.appendChild(me)
  }
  if (show.length) {
    const te = document.createElement('span'); te.className = 'ctag'
    te.textContent = show[0] + (show.length > 1 ? `+${show.length - 1}` : '')
    te.title = show.join('、')
    el.appendChild(te)
  }
  return el
}

// visItems：簇内未被「显示源」隐藏且命中市场域筛选的成员——隐藏/过滤语义同层
const visItems = (c) => c.items.filter((m) => !cfg.hide[m.sourceId] && (!cfg.market || m.market === cfg.market))
// visSrcs：可见成员的源集合——空=整簇隐藏；multi 计数按它算
const visSrcs = (c) => [...new Set(visItems(c).map((m) => m.sourceId))]

function render(clusters, markFresh = true) {
  const vis = clusters.filter((c) => {
    const srcs = visSrcs(c)
    return srcs.length
      && (!cfg.src || c.items.some((m) => m.sourceId === cfg.src))
      && (!cfg.modes.length
        || (cfg.modes.includes('imp') && c.hot)
        || (cfg.modes.includes('multi') && srcs.length >= 2)) // 多选取并集：命中任一即显示
  })
  const list = $('#list')
  list.textContent = ''
  const markKnown = () => { for (const c of clusters) for (const m of c.items) known.add(m.id); firstLoad = false }
  if (!vis.length) { list.innerHTML = '<div class="empty">暂无快讯条目</div>'; markKnown(); return }
  const fresh = []
  const pending = []
  // content 明显长于标题时给「▸正文」开关；正文块插到行后，渲染完统一对齐标题列
  const addBody = (m, box) => {
    const full = decodeEnt((m.content || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')
      .replace(/\n{3,}/g, '\n\n').trim())
    if (full.length <= txt(m).length + 80) return
    const pinned = openBodies.has(m.id)
    const bd = document.createElement('div'); bd.className = 'body'; bd.hidden = !pinned; bd.textContent = full
    const tg = document.createElement('span'); tg.className = 'more'; tg.textContent = pinned ? '▾ 正文' : '▸ 正文'
    // 悬停展开/收起：200ms 宽限让鼠标能从开关移进正文区不收起；
    // 鼠标在「正文开关」或「正文区」任一处都保持展开，两个都离开才收起
    let closeTimer = 0
    const open = () => { bd.hidden = false; tg.textContent = '▾ 正文'; openBodies.add(m.id) }
    const close = () => { bd.hidden = true; tg.textContent = '▸ 正文'; openBodies.delete(m.id) }
    const scheduleClose = () => { clearTimeout(closeTimer); closeTimer = setTimeout(close, 200) }
    const cancelClose = () => clearTimeout(closeTimer)
    tg.addEventListener('mouseenter', () => { cancelClose(); open() })
    tg.addEventListener('mouseleave', scheduleClose)
    bd.addEventListener('mouseenter', cancelClose)
    bd.addEventListener('mouseleave', scheduleClose)
    tg.addEventListener('click', (e) => { e.stopPropagation(); bd.hidden ? open() : close() }) // 兜底：触屏/偏好点击
    box.closest('.row').insertAdjacentElement('afterend', bd)
    box.appendChild(tg)
    pending.push([bd, box])
  }
  for (const c of vis) {
    const rep = c.rep, srcs = visSrcs(c)
    const row = document.createElement('div')
    row.className = 'row'
    if (markFresh && !firstLoad && c.items.some((m) => !known.has(m.id))) { row.classList.add('fresh'); fresh.push(row) }
    const t = document.createElement('span'); t.className = 't'; t.textContent = hm(rep.publishedAt || rep.fetchedAt)
    const s = document.createElement('span')
    // 按源计数：多源簇显示「6条 财联社×3 同花顺×2 新浪」式——总数在前、逐源分布在后
    const cnt = new Map()
    for (const m of visItems(c)) cnt.set(m.sourceId, (cnt.get(m.sourceId) ?? 0) + 1)
    if (cnt.size > 1) {
      const total = [...cnt.values()].reduce((a, b) => a + b, 0)
      s.className = 'src multi'
      const tot = document.createElement('span')
      tot.className = 'tot'; tot.textContent = `${total}条`
      const isOpen = expanded.has(rep.id)
      if (isOpen) {
        // 展开态第 1 行：计数收起钮 + 本源徽标——点任一收起；其余成员行各自带源标
        // 本源被「显示源」隐藏时不显示（防泄漏隐藏源名）
        const chips = [tot]
        if (!cfg.hide[rep.sourceId]) {
          const own = document.createElement('span')
          own.className = 'own'; own.textContent = shortOf(rep.sourceId)
          chips.push(own)
        }
        s.append(...chips, document.createTextNode(' ▾'))
        s.title = `共 ${total} 条 —— 点击收起`
      } else {
        const parts = [...cnt.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([id, n]) => (n > 1 ? `${shortOf(id)}×${n}` : shortOf(id)))
        s.appendChild(tot)
        s.appendChild(document.createTextNode(`${parts.join(' ')} ▸`))
        s.title = `共 ${total} 条：${parts.join('、')} —— 点击展开各源报道`
      }
      s.addEventListener('click', (e) => {
        e.stopPropagation()
        const k = rep.id
        if (expanded.has(k)) expanded.delete(k); else expanded.add(k)
        render(lastItems)
      })
    } else {
      s.className = 'src'; s.textContent = shortOf(srcs[0] ?? rep.sourceId)
    }
    const b = document.createElement('div'); b.className = 'txt'
    const a = document.createElement('a')
    a.href = safeHref(rep.link); a.target = '_blank'; a.rel = 'noopener noreferrer'
    a.textContent = txt(rep) || '(无文本)'
    if (cfg.mark && c.hot) a.className = 'imp'
    b.appendChild(a)
    const tc = tagChips(rep)
    tc ? row.append(t, s, tc, b) : row.append(t, s, b)
    list.appendChild(row)
    addBody(rep, b)
    // 展开态：簇内其余成员各一行（rep 行本身就是代表，不重复列）
    if (expanded.has(rep.id)) {
      for (const m of visItems(c).filter((x) => x !== rep).sort(byTimeDesc)) {
        const sr = document.createElement('div'); sr.className = 'row sub'
        const st = document.createElement('span'); st.className = 't'; st.textContent = hm(m.publishedAt || m.fetchedAt)
        const ss = document.createElement('span'); ss.className = 'src'; ss.textContent = shortOf(m.sourceId)
        const sb = document.createElement('div'); sb.className = 'txt'
        const sa = document.createElement('a')
        sa.href = safeHref(m.link); sa.target = '_blank'; sa.rel = 'noopener noreferrer'
        sa.textContent = txt(m) || '(无文本)'
        if (cfg.mark && isImp(m)) sa.className = 'imp'
        sb.appendChild(sa)
        const tc2 = tagChips(m)
        tc2 ? sr.append(st, ss, tc2, sb) : sr.append(st, ss, sb)
        list.appendChild(sr)
        addBody(m, sb)
      }
    }
  }
  // 正文块缩进 = 标题列 x 坐标（.txt 相对 .row 的 offsetLeft）
  const xs = pending.map(([, box]) => box.offsetLeft)
  pending.forEach(([bd], i) => { bd.style.paddingLeft = `${xs[i]}px` })
  markKnown() // 并集：切源/筛选不把其它源已见条目标成"新"
  if (fresh.length && cfg.auto && markFresh && !firstLoad) window.scrollTo({ top: 0 })
  const latest = vis[0]?.rep?.publishedAt || vis[0]?.rep?.fetchedAt
  const itemCount = vis.reduce((n, c) => n + c.items.length, 0)
  $('#meta').textContent = `${vis.length} 组 · ${itemCount} 条${kw ? ` · "${kw}"` : ''} · 最新 ${latest ? hm(latest) : '—'} · ${new Date().toLocaleTimeString('zh-CN', { hour12: false })} 刷新`
}

async function tick(markFresh = true) {
  try { lastItems = await load(); render(lastItems, markFresh) }
  catch (e) { $('#meta').textContent = `加载失败：${e.message}` }
}

// ---- 控件 ----
$('#btnNow').addEventListener('click', () => tick())
$('#srcSel').addEventListener('change', (e) => { store.set('src', e.target.value); tick(false) })
$('#mktSel').addEventListener('change', (e) => { store.set('market', e.target.value); render(lastItems) })
// 搜索：防抖 300ms 走后端；Esc 清空。range 只在 kw 非空时参与 load()
$('#kw').addEventListener('input', (e) => {
  clearTimeout(kwTimer)
  kwTimer = setTimeout(() => { kw = e.target.value.trim(); tick(false) }, 300)
})
$('#kw').addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  e.target.value = ''; kw = ''; clearTimeout(kwTimer); tick(false)
})
const applyRangeUI = () => { $('#from').hidden = $('#to').hidden = range !== 'custom' }
$('#range').addEventListener('change', (e) => { range = e.target.value; store.set('range', range); applyRangeUI(); if (kw) tick(false) })
$('#from').addEventListener('change', (e) => { customFrom = e.target.value; store.set('cf', customFrom); if (kw) tick(false) })
$('#to').addEventListener('change', (e) => { customTo = e.target.value; store.set('ct', customTo); if (kw) tick(false) })
// 全部/重要/多源：重要·多源可同时选中（并集过滤），点「全部」清空回到全量
const syncModeSeg = (modes) => {
  document.querySelectorAll('#modeSeg button').forEach((x) => {
    x.classList.toggle('on', x.dataset.mode === 'all' ? !modes.length : modes.includes(x.dataset.mode))
  })
}
$('#modeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]'); if (!b) return
  const modes = new Set(cfg.modes)
  if (b.dataset.mode === 'all') modes.clear()
  else if (modes.has(b.dataset.mode)) modes.delete(b.dataset.mode)
  else modes.add(b.dataset.mode)
  const arr = [...modes]
  store.set('mode', arr)
  syncModeSeg(arr)
  render(lastItems)
})
$('#ivMin').addEventListener('change', (e) => {
  const v = Math.min(60, Math.max(1, Math.round(+e.target.value || 1)))
  e.target.value = v; store.set('ivMin', v); armTimer()
})
$('#autoTgl').addEventListener('change', (e) => { store.set('auto', e.target.checked); armTimer() })
const fzApply = () => document.documentElement.style.setProperty('--fz', cfg.fz)
const fzStep = (d) => {
  const v = Math.min(FZ.MAX, Math.max(FZ.MIN, Math.round((cfg.fz + d * FZ.STEP) * 10) / 10))
  store.set('fz', v); fzApply()
  $('#meta').textContent = `字号 ${Math.round(v * 100)}%`
}
$('#fzDn').addEventListener('click', () => fzStep(-1))
$('#fzUp').addEventListener('click', () => fzStep(1))

// ---- 设置弹层 ----
const KXAPI = '/dsh-rss-news-flash-kuaixun/api'
async function kxApi(path, opts) {
  const r = await fetch(`${KXAPI}${path}`, { credentials: 'same-origin', ...opts })
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  return r.json()
}

// ---- tag 式关键字编辑 ----
// 词存服务端 alerts.json（/dsh-rss-news-flash-kuaixun/api/alerts）——命中匹配发生在
// 插件进程的抓取 handler 里，localStorage 页面够不到，必须走 API。
// alertLoaded=false 时不回传 keywords——GET 失败不覆盖服务端词表。
let alertTags = [], alertLoaded = false
const SEP = /[\s,，、;；]+/
const renderAlertTags = () => {
  const box = $('#alertTags'); box.textContent = ''
  alertTags.forEach((kw, i) => {
    const tag = document.createElement('span'); tag.className = 'tag'; tag.title = '点击修改'
    const nm = document.createElement('span'); nm.textContent = kw
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×'; x.title = '删除'
    x.addEventListener('click', (e) => { e.stopPropagation(); alertTags.splice(i, 1); renderAlertTags() })
    tag.append(nm, x)
    tag.addEventListener('click', () => { // 点击 tag → 词回填输入框（删 tag，改完回车重新上屏）
      $('#alertKw').value = kw
      alertTags.splice(i, 1)
      renderAlertTags()
      $('#alertKw').focus()
    })
    box.appendChild(tag)
  })
}
const commitAlertKw = () => {
  const parts = $('#alertKw').value.split(SEP).map((s) => s.trim().slice(0, 30)).filter(Boolean)
  if (!parts.length) return
  const have = new Set(alertTags.map((k) => k.toLowerCase()))
  for (const p of parts) { const k = p.toLowerCase(); if (!have.has(k) && alertTags.length < 20) { alertTags.push(p); have.add(k) } }
  $('#alertKw').value = ''
  renderAlertTags()
}
$('#alertKw').addEventListener('keydown', (e) => {
  if (e.isComposing) return // IME 选词中不抢键（空格/标点都可能是候选确认）
  if (e.key === 'Enter' || (e.key.length === 1 && SEP.test(e.key))) { e.preventDefault(); commitAlertKw() }
  else if (e.key === 'Backspace' && !e.target.value && alertTags.length) { // 空输入退格 → 末位 tag 回填
    $('#alertKw').value = alertTags.pop(); renderAlertTags()
  }
})
$('#alertKw').addEventListener('paste', () => setTimeout(commitAlertKw, 0)) // 粘贴整串按分隔符拆成多个 tag
$('#alKwOn').addEventListener('change', (e) => { $('#alKwBox').hidden = !e.target.checked })

async function openCfg() {
  const box = $('#cfgSrcs'); box.textContent = ''
  for (const s of SOURCES) {
    const row = document.createElement('div'); row.className = 'row2'
    const label = document.createElement('label')
    const cb = document.createElement('input')
    cb.type = 'checkbox'; cb.dataset.src = s.id; cb.checked = !cfg.hide[s.id]
    label.append(cb, document.createTextNode(` ${s.name}`))
    const gap = document.createElement('span'); gap.style.flex = '1'
    const hint = document.createElement('span'); hint.style.opacity = '.55'; hint.textContent = '短标'
    const alias = document.createElement('input')
    alias.type = 'text'; alias.dataset.alias = s.id; alias.value = cfg.alias[s.id] || s.short; alias.maxLength = 6
    row.append(label, gap, hint, alias)
    box.appendChild(row)
  }
  $('#cfgMark').checked = cfg.mark
  $('#cfg').classList.add('open')
  // 提醒配置走服务端——异步载入，不阻塞设置面板；失败时词表不回传
  try {
    const j = await kxApi('/alerts')
    alertTags = [...(j.keywords || [])]
    alertLoaded = true
    $('#alKwOn').checked = !!j.keyword
    $('#alImp').checked = !!j.important
    $('#alMulti').checked = !!j.multi
    $('#alKwBox').hidden = !j.keyword
    $('#alertKw').value = ''
    renderAlertTags()
  } catch { alertLoaded = false; $('#alKwBox').hidden = true }
}
$('#btnCfg').addEventListener('click', openCfg)
$('#cfg').addEventListener('click', (e) => { if (e.target === $('#cfg')) $('#cfg').classList.remove('open') })
$('#cfgOk').addEventListener('click', async () => {
  commitAlertKw() // 输入框里还没上屏的词一并收进来
  const hide = {}, alias = {}
  document.querySelectorAll('#cfgSrcs input[type="checkbox"]').forEach((c) => { if (!c.checked) hide[c.dataset.src] = true })
  document.querySelectorAll('#cfgSrcs input[type="text"]').forEach((t) => {
    const def = SOURCES.find((s) => s.id === t.dataset.alias)?.short
    if (t.value.trim() && t.value.trim() !== def) alias[t.dataset.alias] = t.value.trim()
  })
  store.set('hide', hide); store.set('alias', alias)
  store.set('mark', $('#cfgMark').checked)
  $('#cfg').classList.remove('open')
  render(lastItems)
  // 三通道开关 + 词表一次提交；keywords 仅在载入成功时回传（关开关不删词）
  const body = { keyword: $('#alKwOn').checked, important: $('#alImp').checked, multi: $('#alMulti').checked }
  if (alertLoaded) body.keywords = alertTags
  try {
    await kxApi('/alerts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  } catch { /* 保存失败下次打开设置再试 */ }
})
$('#cfgReset').addEventListener('click', () => {
  for (const k of ['hide', 'alias', 'mark']) localStorage.removeItem(`kx.${k}`)
  openCfg()
})

// ---- 初始化 ----
for (const s of SOURCES) {
  const o = document.createElement('option'); o.value = s.id; o.textContent = s.name
  $('#srcSel').appendChild(o)
}
$('#srcSel').value = cfg.src
$('#mktSel').value = cfg.market
$('#range').value = range; $('#from').value = customFrom; $('#to').value = customTo; applyRangeUI()
$('#ivMin').value = cfg.ivMin
$('#autoTgl').checked = cfg.auto
syncModeSeg(cfg.modes)
fzApply()
function armTimer() {
  clearInterval(timer)
  if (cfg.auto) timer = setInterval(() => { if (!document.hidden) tick() }, cfg.ivMin * 60000)
}
armTimer()
tick()
</script>
</body>
</html>
