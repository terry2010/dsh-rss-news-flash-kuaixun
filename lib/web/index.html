<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快讯</title>
<style>
  :root { color-scheme: light dark; --fz: 1; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: Canvas; color: CanvasText;
  }
  .bar {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
    border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); font-size: 12px;
    flex-wrap: wrap;
  }
  .bar .meta { opacity: .65; }
  .bar button, .bar select {
    height: 26px; padding: 0 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  .bar label { display: flex; align-items: center; gap: 4px; opacity: .8; }
  .fz { display: inline-flex; gap: 2px; }
  .fz button { width: 28px; padding: 0; }
  #list { font-size: calc(13px * var(--fz)); }
  .row {
    display: flex; gap: 10px; padding: 5px 12px; align-items: baseline;
    border-bottom: 1px solid color-mix(in srgb, CanvasText 8%, transparent);
  }
  .row.fresh { animation: flash 2.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, #ff9500 22%, transparent); } to { background: transparent; } }
  .t { flex: none; font-variant-numeric: tabular-nums; opacity: .55; font-size: .85em; padding-top: 2px; }
  .src {
    flex: none; font-size: .75em; opacity: .7; padding: 1px 5px; border-radius: 4px; align-self: center;
    background: color-mix(in srgb, CanvasText 10%, transparent); white-space: nowrap;
  }
  .txt { flex: 1; min-width: 0; }
  .txt a { color: inherit; text-decoration: none; }
  .txt a:hover { text-decoration: underline; }
  .imp { color: #d45500; font-weight: 600; }
  .empty, .err { padding: 30px; text-align: center; opacity: .6; }
  /* ---- 设置弹层 ---- */
  #cfg {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: color-mix(in srgb, CanvasText 30%, transparent);
  }
  #cfg.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; }
  #cfg .panel {
    width: min(420px, 92vw); max-height: 76vh; overflow: auto; padding: 16px 18px;
    background: Canvas; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
    border-radius: 10px; box-shadow: 0 8px 30px color-mix(in srgb, CanvasText 35%, transparent);
    font-size: 13px;
  }
  #cfg h3 { margin: 0 0 10px; font-size: 14px; }
  #cfg h4 { margin: 14px 0 6px; font-size: 12px; opacity: .7; font-weight: 600; }
  #cfg .row2 { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #cfg .row2 .nm { flex: 1; }
  #cfg .row2 input[type="text"] {
    width: 90px; height: 24px; padding: 0 6px; font: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 5px;
    background: transparent; color: inherit;
  }
  #cfg select {
    height: 26px; font: inherit; background: transparent; color: inherit;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 5px;
  }
  #cfg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #cfg .foot button {
    height: 28px; padding: 0 14px; border-radius: 6px; font: inherit; cursor: pointer;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit;
  }
  #cfg .foot .pri { background: #2f6feb; border-color: #2f6feb; color: #fff; }
</style>
</head>
<body>
<div class="bar">
  <b>快讯</b>
  <select id="srcSel" title="只看某个快讯源"><option value="">全部源</option></select>
  <label><input type="checkbox" id="autoroll" checked> 自动滚动新条目</label>
  <span class="fz">
    <button id="fzDn" title="缩小字号">A−</button><button id="fzUp" title="放大字号">A＋</button>
  </span>
  <span class="meta" id="meta">载入…</span>
  <span style="flex:1"></span>
  <button id="btnCfg" title="快讯显示设置">设置</button>
  <button id="btnNow">刷新</button>
</div>
<div id="list"></div>

<div id="cfg">
  <div class="panel">
    <h3>快讯设置</h3>
    <h4>显示源</h4>
    <div id="cfgSrcs"></div>
    <h4>通用</h4>
    <div class="row2"><span class="nm">刷新间隔</span>
      <select id="cfgIv">
        <option value="15000">15 秒</option><option value="30000">30 秒</option>
        <option value="60000">60 秒</option><option value="0">手动</option>
      </select>
    </div>
    <div class="row2"><span class="nm">重要标记（评分 ≥ 阈值高亮）</span>
      <select id="cfgImp">
        <option value="0">不高亮</option><option value="6">6 分</option>
        <option value="7">7 分</option><option value="8" selected>8 分</option><option value="9">9 分</option>
      </select>
    </div>
    <div class="foot"><button id="cfgReset">恢复默认</button><button id="cfgOk" class="pri">完成</button></div>
  </div>
</div>

<script>
'use strict'
const $ = (s) => document.querySelector(s)
const API = '/dsh-rss-news-daily/api'
const SOURCES = [
  { id: 'https://www.cls.cn/telegraph', name: '财联社电报', short: '财联社' },
  { id: 'https://www.jin10.com/', name: '金十数据', short: '金十' },
  { id: 'https://wallstreetcn.com/live', name: '华尔街见闻', short: '见闻' },
  { id: 'https://kuaixun.eastmoney.com/', name: '东方财富', short: '东财' },
  { id: 'https://news.10jqka.com.cn/', name: '同花顺', short: '同花顺' },
  { id: 'https://finance.sina.com.cn/7x24', name: '新浪财经', short: '新浪' },
]

// ---- 视图层配置（localStorage：伴随页自己的持久层，不动主插件 prefs） ----
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(`kx.${k}`)); return v ?? d } catch { return d } },
  set(k, v) { localStorage.setItem(`kx.${k}`, JSON.stringify(v)) },
}
const cfg = {
  get fz() { return store.get('fz', 1) },
  get src() { return store.get('src', '') },           // '' = 全部源
  get hide() { return store.get('hide', {}) },          // {sourceId: true} = 隐藏
  get alias() { return store.get('alias', {}) },        // {sourceId: '短标'}
  get iv() { return store.get('iv', 30000) },           // 刷新间隔 ms，0=手动
  get imp() { return store.get('imp', 8) },             // 高亮阈值，0=不高亮
}
const FZ = { MIN: 0.8, MAX: 1.6, STEP: 0.1 }

let known = new Set(), firstLoad = true, timer = 0

// 主题：?theme= 首帧 + rnd-theme postMessage 跟随主阅读器
const q = new URLSearchParams(location.search)
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme')
window.addEventListener('message', (e) => {
  if (e.data?.type === 'rnd-theme' && e.data.theme) document.documentElement.dataset.theme = e.data.theme
})

const hm = (iso) => {
  const d = new Date(iso), now = new Date()
  const t = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
  return d.toDateString() === now.toDateString() ? t : `${d.getMonth() + 1}/${d.getDate()} ${t}`
}
const txt = (it) => (it.title || '').trim() || (it.content || '').replace(/<[^>]+>/g, '').trim()
const shortOf = (id) => cfg.alias[id] || SOURCES.find((s) => s.id === id)?.short || '快讯'
const isImp = (it) => cfg.imp > 0 && (it.llmScore ?? it.score ?? 0) >= cfg.imp

async function api(path) {
  const r = await fetch(`${API}${path}`, { credentials: 'same-origin' })
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  return r.json()
}

async function load() {
  const pages = await Promise.all([1, 2].map((p) =>
    api(`/items?category=${encodeURIComponent('快讯')}&sort=fetched&page=${p}`).catch(() => ({ items: [] }))))
  return pages.flatMap((x) => x.items || [])
    .sort((a, b) => String(b.fetchedAt || '').localeCompare(String(a.fetchedAt || '')))
    .slice(0, 150)
}

function render(items) {
  const vis = items.filter((i) => !cfg.hide[i.sourceId] && (!cfg.src || i.sourceId === cfg.src))
  const list = $('#list')
  list.textContent = ''
  if (!vis.length) { list.innerHTML = '<div class="empty">暂无快讯条目</div>'; return }
  const fresh = []
  for (const it of vis) {
    const row = document.createElement('div')
    row.className = 'row'
    if (!firstLoad && !known.has(it.id)) { row.classList.add('fresh'); fresh.push(row) }
    const t = document.createElement('span'); t.className = 't'; t.textContent = hm(it.publishedAt || it.fetchedAt)
    const s = document.createElement('span'); s.className = 'src'; s.textContent = shortOf(it.sourceId)
    const b = document.createElement('div'); b.className = 'txt'
    const a = document.createElement('a')
    a.href = it.link || '#'; a.target = '_blank'; a.rel = 'noopener noreferrer'
    a.textContent = txt(it) || '(无文本)'
    if (isImp(it)) a.className = 'imp'
    b.appendChild(a); row.append(t, s, b); list.appendChild(row)
  }
  known = new Set(items.map((i) => i.id))
  if (fresh.length && $('#autoroll').checked && !firstLoad) window.scrollTo({ top: 0 })
  const latest = vis[0]?.fetchedAt
  $('#meta').textContent = `${vis.length} 条 · 最新 ${latest ? hm(latest) : '—'} · ${new Date().toLocaleTimeString('zh-CN', { hour12: false })} 刷新`
  firstLoad = false
}

let lastItems = []
async function tick() {
  try { lastItems = await load(); render(lastItems) }
  catch (e) { $('#meta').textContent = `加载失败：${e.message}` }
}

// ---- 控件 ----
$('#btnNow').addEventListener('click', tick)
$('#autoroll').addEventListener('change', (e) => store.set('roll', e.target.checked))
$('#srcSel').addEventListener('change', (e) => { store.set('src', e.target.value); render(lastItems) })
const fzApply = () => document.documentElement.style.setProperty('--fz', cfg.fz)
const fzStep = (d) => {
  const v = Math.min(FZ.MAX, Math.max(FZ.MIN, Math.round((cfg.fz + d * FZ.STEP) * 10) / 10))
  store.set('fz', v); fzApply()
  $('#meta').textContent = `字号 ${Math.round(v * 100)}%`
}
$('#fzDn').addEventListener('click', () => fzStep(-1))
$('#fzUp').addEventListener('click', () => fzStep(1))

// ---- 设置弹层 ----
function openCfg() {
  const box = $('#cfgSrcs'); box.textContent = ''
  for (const s of SOURCES) {
    const row = document.createElement('div'); row.className = 'row2'
    row.innerHTML = `<label><input type="checkbox" data-src="${s.id}" ${cfg.hide[s.id] ? '' : 'checked'}> ${s.name}</label>
      <span style="flex:1"></span><span style="opacity:.55">短标</span>
      <input type="text" data-alias="${s.id}" value="${cfg.alias[s.id] || s.short}" maxlength="6">`
    box.appendChild(row)
  }
  $('#cfgIv').value = String(cfg.iv)
  $('#cfgImp').value = String(cfg.imp)
  $('#cfg').classList.add('open')
}
$('#btnCfg').addEventListener('click', openCfg)
$('#cfg').addEventListener('click', (e) => { if (e.target === $('#cfg')) $('#cfg').classList.remove('open') })
$('#cfgOk').addEventListener('click', () => {
  const hide = {}, alias = {}
  document.querySelectorAll('#cfgSrcs input[type="checkbox"]').forEach((c) => { if (!c.checked) hide[c.dataset.src] = true })
  document.querySelectorAll('#cfgSrcs input[type="text"]').forEach((t) => {
    const def = SOURCES.find((s) => s.id === t.dataset.alias)?.short
    if (t.value.trim() && t.value.trim() !== def) alias[t.dataset.alias] = t.value.trim()
  })
  store.set('hide', hide); store.set('alias', alias)
  const iv = Number($('#cfgIv').value); store.set('iv', iv); armTimer()
  store.set('imp', Number($('#cfgImp').value))
  $('#cfg').classList.remove('open')
  render(lastItems)
})
$('#cfgReset').addEventListener('click', () => {
  for (const k of ['hide', 'alias', 'iv', 'imp']) localStorage.removeItem(`kx.${k}`)
  openCfg()
})

// ---- 初始化 ----
for (const s of SOURCES) {
  const o = document.createElement('option'); o.value = s.id; o.textContent = s.name
  $('#srcSel').appendChild(o)
}
$('#srcSel').value = cfg.src
$('#autoroll').checked = store.get('roll', true)
fzApply()
function armTimer() { clearInterval(timer); if (cfg.iv > 0) timer = setInterval(() => { if (!document.hidden) tick() }, cfg.iv) }
armTimer()
tick()
</script>
</body>
</html>
